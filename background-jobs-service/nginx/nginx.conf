events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/javascript
        text/xml
        text/plain
        application/xml
        application/xml+rss;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=jobs:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=2r/s;

    # Upstream servers (for horizontal scaling)
    upstream bg_jobs_backend {
        least_conn;
        server bg-jobs-service:3001 max_fails=3 fail_timeout=30s;
        # Add more instances for scaling:
        # server bg-jobs-service-2:3001 max_fails=3 fail_timeout=30s;
        # server bg-jobs-service-3:3001 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    # Health check upstream
    upstream bg_jobs_health {
        server bg-jobs-service:3001;
        keepalive 8;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://bg_jobs_health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            access_log off; # Disable logging for health checks
        }

        # Admin endpoints (strict rate limiting)
        location /admin {
            limit_req zone=admin burst=5 nodelay;
            
            proxy_pass http://bg_jobs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Job submission endpoints (moderate rate limiting)
        location ~ ^/jobs/(submit|bulk) {
            limit_req zone=jobs burst=10 nodelay;
            
            proxy_pass http://bg_jobs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s; # Allow longer for bulk operations
            proxy_read_timeout 120s;
            
            # Enable buffering for POST requests
            proxy_request_buffering on;
            proxy_buffering on;
        }

        # General job endpoints
        location /jobs {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://bg_jobs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_Set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API documentation
        location /api-docs {
            proxy_pass http://bg_jobs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache for 1 hour
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Root endpoint
        location / {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://bg_jobs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle 404 errors
        error_page 404 = @not_found;
        location @not_found {
            default_type application/json;
            return 404 '{"error":"Not Found","message":"The requested resource was not found","timestamp":"$time_iso8601"}';
        }

        # Handle 5xx errors
        error_page 500 502 503 504 = @server_error;
        location @server_error {
            default_type application/json;
            return 500 '{"error":"Internal Server Error","message":"The server encountered an unexpected condition","timestamp":"$time_iso8601"}';
        }

        # Handle rate limit errors
        error_page 429 = @rate_limit;
        location @rate_limit {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later.","timestamp":"$time_iso8601"}';
        }
    }

    # Status page for monitoring
    server {
        listen 8090;
        server_name localhost;
        
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }
        
        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"healthy","server":"nginx","timestamp":"$time_iso8601"}';
        }
    }
}